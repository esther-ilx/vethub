<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<script>
			// Keep in sync with $lib/theme: this runs before styles and the first paint.
			try {
				const theme = localStorage.getItem('vethub.theme');
				if (theme === 'light' || theme === 'dark' || theme === 'playful') {
					document.documentElement.dataset.theme = theme;
				}
			} catch {
				// Storage may be unavailable; the root already defaults to Light.
			}
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="VetHub - Veterinary Clinic Management System by ilionx" />
		<meta name="theme-color" content="#E8003D" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
